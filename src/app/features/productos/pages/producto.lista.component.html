<div class="producto-container">
    <mat-card class="container">
        <div class="header">
            <h2 class="titulo">Listado de Productos</h2>
            <button class="btn-nuevo-producto" [routerLink]="['/producto/crear']" mat-flat-button color="primary">
                <mat-icon style="margin-right: 5px !important;" >add_circle</mat-icon>
                Nuevo Producto
            </button>
        </div>

        <mat-divider></mat-divider>

        <!-- FILTROS -->
        <div class="filters">
            <mat-label style="color: #fff;">Código:</mat-label>
            <mat-form-field appearance="outline">
                <!--<mat-label>Código</mat-label>-->
                <input placeholder="Código" matInput [(ngModel)]="filtro.codigo">
            </mat-form-field>

            <mat-label style="color: #fff;">Nombre:</mat-label>
            <mat-form-field appearance="outline">
                <!--<mat-label>Nombre</mat-label>-->
                <input placeholder="Nombre" matInput [(ngModel)]="filtro.nombre">
            </mat-form-field>

            <button class="btn-buscar" (click)="filtrarProducto()" mat-raised-button color="accent">
                <mat-icon style="margin-right: 5px !important; font-size: 20px;">search</mat-icon>
                Buscar
            </button>
        </div>

        <!--Diseño de la tabla-->
        <table mat-table [dataSource]="productos" class="mat-elevation-z2">
            <!-- Código -->
            <ng-container matColumnDef="codigo">
                <th mat-header-cell *matHeaderCellDef style="letter-spacing: 1px;"> Código </th>
                <td mat-cell *matCellDef="let p"> {{p.id}} </td>
            </ng-container>
            <!-- Nombre -->
            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef style="letter-spacing: 1px;"> Nombre </th>
                <td mat-cell *matCellDef="let p"> {{p.nombre}} </td>
                </ng-container>
            
            <!-- Descripción -->
            <ng-container matColumnDef="descripcion">
                <th mat-header-cell *matHeaderCellDef style="letter-spacing: 1px;"> Descripción </th>
                <td mat-cell *matCellDef="let p"> {{p.descripcion}} </td>
            </ng-container>

            <!-- Precio -->
            <ng-container matColumnDef="precio">
                <th mat-header-cell *matHeaderCellDef style="letter-spacing: 1px;"> Precio Unitario </th>
                <td mat-cell *matCellDef="let p"> {{p.precio | currency: 'PE': 'S/. ':'1.2-2'}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </mat-card>
